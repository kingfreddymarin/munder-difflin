appId: com.studio.paramount
productName: Paramount
copyright: Copyright © 2026 Chaitanya Giri

# Paramount shell: a fork of Munder Difflin that ships only the backend (main +
# preload); the UI is the separate Paramount app, bundled below via
# extraResources. No update feed (publish: null, so no app-update.yml), no
# munderdifflin:// scheme, no notarize hook: the mac build is unsigned.
publish: null

# Kept from upstream: inert while publish is null (no latest*.yml is written),
# but it stamps the toast's "What's new" list if an update feed is ever turned
# back on, and test/release-notes.test.cjs guards it.
releaseInfo:
  releaseNotesFile: build/release-notes.md

# electron-vite emits the app into out/; package exactly that plus what the
# runtime needs. node-pty is native, so keep it out of the asar.
directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  # v0.3.4: shipped so the voice get_app_info tool can read release notes.
  - CHANGELOG.md
  - "!**/*.{md,map,ts,tsx}"
  - "!**/{.eslintrc,.prettierrc,tsconfig*.json,electron.vite.config.*}"

# Ship the standalone Slack reply helper as a plain file under the app's
# resources dir (process.resourcesPath). It runs under `node`, NOT inside the
# asar, so the office worker can invoke `node <resources>/md-slack-reply.cjs`.
extraResources:
  # The Paramount UI build (00-new/apps/paramount, `npm run build` there).
  # Served at runtime over paramount://app/ from <resources>/paramount-ui.
  # Placeholder: electron-builder.config.cjs (the --config every dist script
  # passes) replaces it with the absolute dir from scripts/paramount-ui-dist.cjs:
  # default ../paramount/dist, override with PARAMOUNT_UI_DIST. A bare
  # `electron-builder` (no --config) would skip it and ship no UI.
  - from: PARAMOUNT_UI_DIST
    to: paramount-ui
  - from: resources/md-slack-reply.cjs
    to: md-slack-reply.cjs
  # Knowledge Graph agent CLI + its pure-JS core. Agents invoke `node
  # <resources>/kg.cjs` out-of-process; kg-core.cjs ships beside it so the CLI's
  # `require('./kg-core.cjs')` resolves outside the asar.
  - from: resources/kg.cjs
    to: kg.cjs
  - from: src/main/kg-core.cjs
    to: kg-core.cjs
  # Bundled default skills (read-only/no-secret). copyBundledSkills() reads these
  # from skillsResourceDir() = <process.resourcesPath>/skills in the packaged app
  # and refreshes each agent's .claude/skills/ per spawn (dev resolves to
  # repo resources/skills). Directory copy preserves the <id>/SKILL.md tree.
  - from: resources/skills
    to: skills

asarUnpack:
  - "**/node_modules/node-pty/**"
  # better-sqlite3 is native (bindings/prebuild need the .node on the real FS).
  - "**/node_modules/better-sqlite3/**"

# Rebuild native deps (node-pty) for the target during packaging.
npmRebuild: true

# ---- macOS ----
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  extendInfo:
    NSDocumentsFolderUsageDescription: "Paramount runs your Claude Code agents, which read and write files in the project folders you point them at."
    NSDesktopFolderUsageDescription: "Paramount's agents may work on projects located on your Desktop."
    NSDownloadsFolderUsageDescription: "Paramount's agents may work on projects located in your Downloads."
    NSRemovableVolumesUsageDescription: "Paramount's agents may work on projects located on external volumes."
    NSNetworkVolumesUsageDescription: "Paramount's agents may work on projects located on network volumes."
    NSMicrophoneUsageDescription: "Paramount uses your microphone only for its opt-in voice features."
  # Unsigned: no keychain lookup, no hardened runtime, no notarization.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  target:
    - target: dmg

dmg:
  title: Paramount ${version}
  artifactName: Paramount-${version}-${arch}.dmg

# ---- Windows ----
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Paramount-${version}-win-x64-setup.exe
  shortcutName: Paramount

portable:
  artifactName: Paramount-${version}-win-x64-portable.exe

# ---- Linux ----
linux:
  category: Development
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
  artifactName: Paramount-${version}-linux-x86_64.AppImage
