name: Prepare Paramount dependencies
description: Install locked core and UI dependencies without generating a product build.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: |
          package-lock.json
          ui/package-lock.json

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Provide distutils for native test dependencies
      shell: bash
      run: python -m pip install --upgrade setuptools

    - name: Prepare logs
      shell: bash
      run: mkdir -p logs

    - name: Install locked core dependencies
      shell: bash
      run: npm ci 2>&1 | tee logs/root-npm-ci.log

    - name: Install locked UI dependencies
      shell: bash
      working-directory: ui
      run: npm ci 2>&1 | tee ../logs/ui-npm-ci.log
