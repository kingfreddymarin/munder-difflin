name: CI

# Development validation only. Release PRs use release.yml so those checks run
# once, in order, before packaging. Pushes never generate an application build.
on:
  push:
    branches: [main, dev, release]
  pull_request:
    branches-ignore: [release]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: 1. Typecheck
    uses: ./.github/workflows/typecheck.yml

  tests:
    name: 2. Tests
    needs: [typecheck]
    uses: ./.github/workflows/tests.yml
