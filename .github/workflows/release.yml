name: Release PR

# A release PR is the only automatic product-build entry point. Each update
# validates the PR merge commit before generating its unsigned DMG artifact.
on:
  pull_request:
    branches: [release]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: 1. Typecheck
    uses: ./.github/workflows/typecheck.yml

  tests:
    name: 2. Tests
    needs: [typecheck]
    uses: ./.github/workflows/tests.yml

  build:
    name: 3. Build release candidate
    needs: [typecheck, tests]
    uses: ./.github/workflows/build.yml
